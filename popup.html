<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #1d9bf0; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0d8bd9; }
    #status { margin-top: 8px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <h3 style="margin: 0 0 16px;">Thread → Notion</h3>
  <label>Paste your Notion Token:</label>
  <input id="token" placeholder="secret_abc123..." type="password">
  <button id="save">Save Active Thread</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
